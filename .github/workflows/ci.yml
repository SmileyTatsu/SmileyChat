name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # `contents: write` is only used by the typings step below, which commits
    # regenerated plugin API typings when a push left them stale. Pull requests
    # (including ones from forks) only get the check.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # `types/smileychat-plugin-api.d.ts` is generated from
      # `src/lib/plugins/types.ts`, and a stale copy used to cost a follow-up
      # commit on every type change. On pushes to this repo it is regenerated and
      # committed before the rest of the pipeline runs, so `main` cannot go red
      # over typings alone. The pre-commit hook (.githooks/pre-commit, installed
      # by `bun install`) usually means this step has nothing to push.
      - name: Regenerate plugin API typings
        if: github.event_name != 'pull_request'
        run: |
          bun run plugin-types

          if [ -z "$(git status --porcelain types/)" ]; then
            echo "Plugin API typings are already up to date."
            exit 0
          fi

          git config user.name "smileychat-typings-bot"
          git config user.email "typings-bot@users.noreply.github.com"
          git add types/
          git commit \
            -m "chore(plugins): regenerate API typings" \
            -m "Generated by CI from src/lib/plugins/types.ts. Run \`bun run plugin-types\` before pushing, or install the pre-commit hook with \`bun install\`."
          git push

      - name: Plugin API typings are up to date
        if: github.event_name == 'pull_request'
        run: bun run plugin-types:check

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun test

      - name: Build
        run: bun run build
